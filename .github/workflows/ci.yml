name: CI

on:
  push:
    branches: [master, main, production/hardening]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash on every runner, Windows included, so each step is one script rather
    # than one per operating system. Windows runners ship Git Bash.
    shell: bash

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # Every platform reports: "which platforms are broken" is the question.
      fail-fast: false
      matrix:
        include:
          # The installer picks the host triple, so no triple is listed here.
          #
          # The published macOS and Linux-gnu archives link libLLVM dynamically,
          # so a lane needs LLVM 22 installed too. Homebrew publishes llvm@22 for
          # Apple Silicon only (no x86_64 bottle), so an Intel macOS runner cannot
          # run the x86_64 artifact; that absence is a property of the release, and
          # `macos-legacy` compiles the source instead so Intel coverage exists
          # rather than silently disappearing. Everywhere else installs LLVM 22
          # and runs the release artifact.
          - name: linux-x86_64
            runner: ubuntu-24.04
            llvm: apt
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            llvm: apt
          - name: macos-arm64
            runner: macos-15
            llvm: brew
          - name: macos-legacy
            runner: macos-15-intel
            finc: source
          - name: windows-x86_64
            runner: windows-2022
            exe: .exe
    steps:
      - uses: actions/checkout@v4

      # The release archive links libLLVM dynamically on Linux and macOS, so the
      # runtime has to be present before finc can run at all. Pinned to the major
      # the release was built against; a mismatch fails at `finc --version`
      # rather than producing confusing downstream errors.
      - name: Install LLVM 22 (Linux)
        if: matrix.llvm == 'apt'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm22.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq libllvm22
          sudo ldconfig

      - name: Install LLVM 22 (macOS)
        if: matrix.llvm == 'brew'
        run: |
          set -euo pipefail
          brew install llvm@22

      # The release archive carries bin/finc and lib/std, and finc finds its
      # standard library relative to its own binary, so no --fin-libs is needed.
      # The installer verifies the published SHA-256 and refuses an artifact it
      # cannot verify.
      - name: Install pinned finc
        if: matrix.finc != 'source'
        run: |
          set -euo pipefail
          python3 .github/scripts/install_finc.py
          echo "${{ github.workspace }}/.finc/bin" >> "$GITHUB_PATH"

      # finc links generated programs with clang, which on Windows needs the
      # Visual Studio SDK libraries from a Developer shell. Without this the
      # compiler runs but every `-o` build fails at the link step.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Report the linker driver
        if: runner.os == 'Windows'
        run: |
          clang --version | head -1

      # Only the lane whose published artifact cannot run does this. It is slow,
      # so it is one lane, and it is honest about being a source build rather
      # than pretending the release artifact worked.
      - name: Build finc from source (legacy lane)
        if: matrix.finc == 'source'
        run: |
          set -euo pipefail
          brew install llvm@22 cmake ninja bison flex
          git clone --depth 1 --branch v1.0.0 https://github.com/M1778/Fin.git "$RUNNER_TEMP/Fin"
          cd "$RUNNER_TEMP/Fin"
          export PATH="$(brew --prefix llvm@22)/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          ls CMakeUserPresets.json 2>/dev/null && rm -f CMakeUserPresets.json
          ./build.sh --release --no-test
          echo "$RUNNER_TEMP/Fin/build" >> "$GITHUB_PATH"

      - name: Require contract 3
        run: |
          set -euo pipefail
          finc --version | tee version.txt
          grep -q "contract 3" version.txt

      # A type-check is not a test. Every script below builds an executable and
      # runs it; a nonzero program exit fails the job.
      - name: Type-check the library
        run: finc src/validate.fin

      - name: Baseline and ownership tests
        run: |
          set -euo pipefail
          finc tests/test_validate.fin -I src -o "test_validate${{ matrix.exe }}"
          "./test_validate${{ matrix.exe }}"

      - name: Boundary tests
        run: |
          set -euo pipefail
          finc tests/test_boundaries.fin -I src -o "test_boundaries${{ matrix.exe }}"
          "./test_boundaries${{ matrix.exe }}"

      - name: Reuse tests
        run: |
          set -euo pipefail
          finc tests/test_reuse.fin -I src -o "test_reuse${{ matrix.exe }}"
          "./test_reuse${{ matrix.exe }}"

      - name: Example
        run: |
          set -euo pipefail
          finc examples/basic.fin -I src -o "example_basic${{ matrix.exe }}"
          output="$("./example_basic${{ matrix.exe }}")"
          printf '%s\n' "$output"
          expected="signup rejected, 4 problem(s):
            - field 'username' is too short: 2 bytes, minimum 3
            - field 'email' is not a valid email address: expected local@domain.tld, letters-only TLD of at least 2
            - field 'age' is above the maximum: 200, maximum 120
            - field 'role' is not one of the 3 allowed values"
          if [ "$output" != "$expected" ]; then
            echo "::error::example output does not match the README/published output"
            exit 1
          fi

  # `finn` is the real package manager; a finn.toml it cannot consume is a
  # packaging bug, so this lane exercises the manifest with the published tool.
  package:
    name: package-finn
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned finc
        run: |
          set -euo pipefail
          python3 .github/scripts/install_finc.py
          echo "${{ github.workspace }}/.finc/bin" >> "$GITHUB_PATH"

      - name: Require contract 3
        run: |
          set -euo pipefail
          finc --version | tee version.txt
          grep -q "contract 3" version.txt

      - name: Install finn
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/M1778/finn finn

      - name: finn test
        run: finn test

      - name: finn do check
        run: finn do check

      - name: finn do example
        run: finn do example
