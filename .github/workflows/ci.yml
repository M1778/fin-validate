name: CI

# The compiler comes from a pinned published release, not from a source build.
#
# FINC_VERSION pins it; .github/scripts/install_finc.py verifies the archive's
# sha256 against the release index before unpacking. On Linux it takes the static
# musl build, which needs no LLVM runtime on the runner.
#
# The macOS archive is *not* self-contained: it links
# /opt/homebrew/opt/llvm@22/lib/libLLVM.dylib, so the runtime has to be installed
# before finc can start. That is why the macOS lane installs llvm@22 first.
#
# Intel macOS is not a lane. The published x86_64-apple-darwin archive needs the
# same dylib, Homebrew publishes llvm@22 for Apple Silicon only, and covering it
# would mean a six-minute source build of the compiler per run. The README says
# Intel macOS is untested rather than claiming it.

on:
  push:
    branches: [master, main, production/hardening]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash on every runner, Windows included, so each step is one script rather
    # than one per operating system. Windows runners ship Git Bash.
    shell: bash

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # A validation library that fails on one platform is a fact worth learning
      # alongside whether it passes on the others, so the matrix does not stop at
      # the first failure.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
            llvm: brew
          - name: windows-x86_64
            runner: windows-2022
            exe: .exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Homebrew ships libLLVM.dylib rather than libLLVM-<major>, and finc looks
      # for the Homebrew keg at link time. Installing it is what lets both the
      # compiler start and the programs it builds link.
      - name: Install the LLVM runtime (macOS)
        if: matrix.llvm == 'brew'
        run: brew install llvm@22

      - name: Install the pinned finc
        run: python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"

      - name: Put finc on PATH
        run: |
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/finc/bin/finc" --version

      # The installer only checks that some contract integer is reported. This
      # library is written and tested against 3, and finn branches on it.
      - name: Require contract 3
        run: |
          set -euo pipefail
          finc --version | tee version.txt
          grep -q "contract 3" version.txt

      # finc links generated programs with clang, which on Windows needs the
      # Visual Studio SDK libraries from a Developer shell.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Type-check the library
        run: finc src/validate.fin

      # Every step below builds an executable and runs it. A type-check is not a
      # test, and a nonzero program exit fails the job.
      - name: Baseline and ownership tests
        run: |
          set -euo pipefail
          finc tests/test_validate.fin -I src -o "$RUNNER_TEMP/test_validate${{ matrix.exe }}"
          "$RUNNER_TEMP/test_validate${{ matrix.exe }}"

      - name: Boundary tests
        run: |
          set -euo pipefail
          finc tests/test_boundaries.fin -I src -o "$RUNNER_TEMP/test_boundaries${{ matrix.exe }}"
          "$RUNNER_TEMP/test_boundaries${{ matrix.exe }}"

      - name: Reuse tests
        run: |
          set -euo pipefail
          finc tests/test_reuse.fin -I src -o "$RUNNER_TEMP/test_reuse${{ matrix.exe }}"
          "$RUNNER_TEMP/test_reuse${{ matrix.exe }}"

      - name: Example output
        run: |
          set -euo pipefail
          finc examples/basic.fin -I src -o "$RUNNER_TEMP/example_basic${{ matrix.exe }}"
          # The program writes through the C runtime, which opens stdout in text
          # mode on Windows and turns every "\n" into "\r\n". Compare with the
          # carriage returns removed so this is about the message, not the host's
          # newline convention.
          output="$("$RUNNER_TEMP/example_basic${{ matrix.exe }}" | tr -d '\r')"
          printf '%s\n' "$output"
          expected="signup rejected, 4 problem(s):
            - field 'username' is too short: 2 bytes, minimum 3
            - field 'email' is not a valid email address: expected local@domain.tld, letters-only TLD of at least 2
            - field 'age' is above the maximum: 200, maximum 120
            - field 'role' is not one of the 3 allowed values"
          if [ "$output" != "$expected" ]; then
            echo "::error::example output does not match the README/published output"
            printf 'expected:\n%s\n' "$expected"
            exit 1
          fi

  # `finn` is the real package manager; a finn.toml it cannot consume is a
  # packaging bug, so this lane exercises the manifest with the published tool.
  package:
    name: package-finn
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # finc links every program with `-lLLVM-22`, so a `-o` build needs that
      # library even when the program never calls LLVM. It ships in llvm-22-dev
      # under /usr/lib/llvm-22/lib -- a directory ld does not search by default --
      # while the `libllvm22` runtime package only provides libLLVM.so.22.1.
      - name: Install the LLVM link libraries
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm22.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq libllvm22 llvm-22-dev
          sudo ldconfig
          # finc reads FIN_LDFLAGS, and its value *replaces* the default library
          # set, so the defaults have to be restated alongside the search path.
          printf 'FIN_LDFLAGS=-L/usr/lib/llvm-22/lib -Wl,--as-needed -lLLVM-22 -lm\n' >> "$GITHUB_ENV"
          test -e /usr/lib/llvm-22/lib/libLLVM-22.so

      - name: Install the pinned finc
        run: |
          set -euo pipefail
          python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"

      - name: Require contract 3
        run: |
          set -euo pipefail
          finc --version | tee version.txt
          grep -q "contract 3" version.txt

      - name: Install finn
        run: cargo install --locked --git https://github.com/M1778/finn finn

      - name: finn test
        run: finn test

      - name: finn do check
        run: finn do check

      - name: finn do example
        run: finn do example
